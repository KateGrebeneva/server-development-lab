          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Нет прав на изменение сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Учебная сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт состояния учебной сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /study-sessions/{id}/pomodoro-intervals:
    get:
      summary: Получение Pomodoro-интервалов учебной сессии
      tags:
        - StudySessions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор учебной сессии
          schema:
            type: integer
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PomodoroIntervalResponse'
        '401':
          description: Клиент не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Нет прав на просмотр интервалов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Учебная сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /study-time-logs:
    get:
      summary: Получение учёта учебного времени
      tags:
        - StudyTimeLogs
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          description: Идентификатор учащегося (для просмотра учебного времени родителем)
          schema:
            type: integer
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudyTimeLogResponse'
        '401':
          description: Клиент не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Нет прав на просмотр учебного времени
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Сохранение затраченного учебного времени
      tags:
        - StudyTimeLogs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudyTimeLogRequest'
      responses:
        '201':
          description: Учебное время успешно сохранено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyTimeLogResponse'
        '400':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Клиент не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Нет прав на сохранение учебного времени
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /activity-zones:
    get:
      summary: Получение зон активности
      tags:
        - ActivityZones
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          description: Идентификатор учащегося (для просмотра статистики родителем)
          schema:
            type: integer
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityZoneResponse'
        '401':
          description: Клиент не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Нет прав на просмотр статистики
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /achievements:
    get:
      summary: Получение справочника достижений
      tags:
        - Achievements
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
