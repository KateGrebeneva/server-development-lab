      tags:
        - Goals
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Учебная цель успешно удалена
        '401':
          description: Клиент не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Нет прав на удаление цели
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Учебная цель не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /study-sessions:
    get:
      summary: Получение списка учебных сессий
      tags:
        - StudySessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный запрос
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudySessionResponse'
        '401':
          description: Клиент не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Создание и планирование учебной сессии
      tags:
        - StudySessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudySessionRequest'
      responses:
        '201':
          description: Учебная сессия успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySessionResponse'
        '400':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Клиент не аутентифицирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Нет прав на создание сессии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Учебный предмет не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /study-sessions/{id}:
    patch:
      summary: Изменение учебной сессии (состояние Pomodoro)
      tags:
        - StudySessions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор учебной сессии
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchStudySessionRequest'
      responses:
        '200':
          description: Учебная сессия успешно изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySessionResponse'
        '400':
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
