        '403':
          description: Нет прав на использование AI Study Companion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Необработанная ошибка на стороне сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
        - role
      properties:
        email:
          type: string
          format: email
          example: student@example.com
        password:
          type: string
          example: "password"
        name:
          type: string
          example: "Иван Иванов"
        role:
          type: string
          enum:
            - student
            - parent
            - teacher
            - admin
          example: student
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: student@example.com
        password:
          type: string
          example: "password"
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: student@example.com
        name:
          type: string
          example: "Иван Иванов"
        role:
          type: string
          enum:
            - student
            - parent
            - teacher
            - admin
          example: student
        avatar_url:
          type: string
          example: "https://example.com/avatar.png"
        theme:
          type: string
          example: "light"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateSubjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Математика"
        color:
          type: string
          example: "#4F46E5"
        category:
          type: string
          example: "exact"
    UpdateSubjectRequest:
      type: object
      required:
        - name
        - color
        - category
      properties:
        name:
          type: string
          example: "Математика"
        color:
          type: string
          example: "#4F46E5"
        category:
          type: string
          example: "exact"
    PatchSubjectRequest:
      type: object
      properties:
        name:
          type: string
          example: "Алгебра"
        color:
          type: string
          example: "#22C55E"
        category:
          type: string
          example: "exact"
    SubjectResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Математика"
        color:
          type: string
          example: "#4F46E5"
        category:
          type: string
          example: "exact"
        time_studied_minutes:
          type: integer
          example: 120
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTaskRequest:
      type: object
      required:
        - subject_id
        - title
      properties:
        subject_id:
          type: integer
          example: 1
        title:
          type: string
          example: "Решить задачи по теме"
        description:
          type: string
          example: "Задачи 1–10"
        priority:
          type: string
          example: "high"
        due_date:
          type: string
          format: date-time
    PatchTaskRequest:
      type: object
      properties:
        title:
          type: string
          example: "Решить задачи по теме"
        description:
          type: string
          example: "Задачи 1–10"
        priority:
          type: string
          example: "high"
        is_completed:
          type: boolean
          example: true
        due_date:
          type: string
          format: date-time
    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        subject_id:
          type: integer
          example: 1
        title:
          type: string
          example: "Решить задачи по теме"
        description:
          type: string
          example: "Задачи 1–10"
        priority:
          type: string
          example: "high"
        is_completed:
          type: boolean
          example: false
        due_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateGoalRequest:
      type: object
